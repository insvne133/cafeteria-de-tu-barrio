name: CI y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Clave PUBLICABLE de Supabase (pública por diseño, la misma que ya va en la web).
      # La tabla contact_submissions solo permite INSERT anónimo con RLS; nadie puede leer.
      VITE_SUPABASE_URL: https://c--74262347-e915-4726-8c21-80af7c67d583-prod.lovable.cloud
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uTcScqsxNWZH90E3AX0twQ_p2YpyoIE
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Tipos
        run: bunx tsc --noEmit
      - name: Tests
        run: bun run test
      - name: Build para GitHub Pages
        run: bun run build
        env:
          GITHUB_PAGES: "1"
          PAGES_REPO: ${{ github.event.repository.name }}
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: web
          path: dist/client

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - name: Publica en la rama gh-pages (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
